name: Simulator tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check application syntax
        run: node --check assets/trading_bot_ai_3_7_2.js
      - name: Run offline simulator tests
        run: node --test --test-isolation=none tests/engine.test.cjs
